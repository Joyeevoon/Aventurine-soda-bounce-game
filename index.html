<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>汽水弹跳</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #BFE3F5 0%, #A8D8F0 100%);
            overflow: hidden;
            width: 100vw;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: linear-gradient(180deg, #D8F0FB 0%, #C2E6F7 45%, #AFE0F5 100%);
            overflow: hidden;
            box-shadow: 0 18px 60px rgba(60, 130, 175, 0.25);
        }

        #canvas { display: block; width: 100%; height: 100%; background: transparent; }

        /* ---------- HUD pills ---------- */
        .hud {
            position: absolute;
            top: calc(14px + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 999px;
            padding: 7px 16px 7px 12px;
            box-shadow: 0 4px 14px rgba(60, 130, 175, 0.16);
            z-index: 10;
        }
        #scoreDisplay { left: 14px; }
        #highScoreDisplay { right: 14px; }

        .hud .dot { width: 10px; height: 10px; border-radius: 50%; }
        #scoreDisplay .dot { background: linear-gradient(135deg, #FFD86B, #F0B429); }
        #highScoreDisplay .dot { background: linear-gradient(135deg, #B7A6F5, #8E7CE0); }

        .hud .label { font-size: 11px; color: #4A7A96; letter-spacing: 1px; font-weight: 600; }
        .hud .value { font-size: 22px; font-weight: 800; color: #E8A200; line-height: 1; font-variant-numeric: tabular-nums; }
        #highScoreDisplay .value { color: #7B68C9; }

        .holder {
            position: absolute;
            top: calc(56px + env(safe-area-inset-top));
            right: 14px;
            font-size: 11px;
            color: #4A7A96;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 999px;
            padding: 3px 12px;
            z-index: 10;
            max-width: 46%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .holder.hidden { display: none; }

        #musicToggle {
            position: absolute;
            top: calc(94px + env(safe-area-inset-top));
            right: 14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 14px rgba(60, 130, 175, 0.16);
            color: #3E9BD6;
            font-size: 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            cursor: pointer;
        }
        #musicToggle.off { color: #9DBFCE; }
        #musicToggle.off::after {
            content: "";
            position: absolute;
            width: 26px;
            height: 2.5px;
            background: #3E9BD6;
            border-radius: 2px;
            transform: rotate(-45deg);
        }

        #credit {
            position: absolute;
            bottom: calc(44px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: rgba(74, 122, 150, 0.55);
            white-space: nowrap;
            z-index: 5;
        }

        /* ---------- instruction ---------- */
        #instruction {
            position: absolute;
            bottom: calc(14px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #3E708F;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 999px;
            padding: 6px 16px;
            white-space: nowrap;
            z-index: 10;
        }

        /* ---------- charge bar ---------- */
        #chargeBar {
            position: absolute;
            bottom: calc(64px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: min(58vw, 250px);
            height: 16px;
            background: rgba(255, 255, 255, 0.6);
            border: 2.5px solid rgba(255, 255, 255, 0.95);
            border-radius: 999px;
            overflow: hidden;
            display: none;
            z-index: 10;
            box-shadow: 0 4px 16px rgba(60, 130, 175, 0.22);
        }
        #chargeBarFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #C9ECFF 0%, #FFD86B 55%, #F0A500 100%);
            border-radius: 999px;
            transition: width 0.04s linear;
        }
        #chargeBar.flash #chargeBarFill { animation: flash 0.45s ease-in-out infinite; }
        @keyframes flash {
            0%, 100% { filter: brightness(1); box-shadow: 0 0 0 rgba(240,165,0,0); }
            50% { filter: brightness(1.3); box-shadow: 0 0 14px 4px rgba(240, 165, 0, 0.6); }
        }

        /* ---------- game over modal ---------- */
        #gameOverModal {
            position: absolute;
            inset: 0;
            background: rgba(30, 80, 110, 0.38);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #gameOverContent {
            background: linear-gradient(180deg, #FFFFFF 0%, #EFF9FF 100%);
            padding: 36px 40px 32px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 24px 70px rgba(20, 70, 100, 0.35);
            width: min(78%, 320px);
            max-height: 88%;
            overflow-y: auto;
            animation: cardIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes cardIn {
            from { transform: scale(0.7) translateY(30px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        #newRecordBadge {
            display: none;
            margin: 0 auto 14px;
            width: fit-content;
            font-size: 17px;
            font-weight: 800;
            color: #FFF;
            background: linear-gradient(135deg, #FFD86B, #F0A500);
            padding: 6px 18px;
            border-radius: 999px;
            box-shadow: 0 4px 14px rgba(240, 165, 0, 0.4);
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), bob 1.2s 0.6s ease-in-out infinite alternate;
        }
        @keyframes bounceIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        @keyframes bob {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        #gameOverTitle { font-size: 30px; font-weight: 800; color: #E8823A; letter-spacing: 2px; margin-bottom: 12px; }
        #gameOverMessage { font-size: 16px; color: #35688A; font-weight: 600; margin-bottom: 22px; }

        #recordPrompt {
            font-size: 15px;
            font-weight: 800;
            color: #E8823A;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        /* visibility instead of display:none: hiding the prompt/input on blur
           must not reflow the modal, or the restart button shifts between
           mousedown and mouseup and the click is lost */
        #recordPrompt.hidden { visibility: hidden; }
        #recordNameRow { margin: 0 0 14px; }
        #recordNameRow.hidden { visibility: hidden; }
        #recordNameInput {
            width: 100%;
            border: 2px solid #A8D5EE;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 15px;
            color: #35688A;
            background: #FFF;
            outline: none;
            text-align: center;
        }
        #recordNameInput:focus { border-color: #E8823A; }
        #recordNameInput::placeholder { color: #9CC2D8; }

        .scoreRow {
            display: flex;
            justify-content: space-between;
            background: rgba(168, 213, 238, 0.28);
            border-radius: 14px;
            padding: 10px 18px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4A7A96;
        }
        .scoreRow b { font-size: 20px; color: #E8823A; font-variant-numeric: tabular-nums; }
        .scoreRow.gold b { color: #7B68C9; }

        #restartButton {
            margin-top: 18px;
            width: 100%;
            background: linear-gradient(135deg, #5FB6E8 0%, #3E9BD6 100%);
            color: white;
            border: none;
            padding: 15px 0;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 6px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(62, 155, 214, 0.45);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        #restartButton:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(62, 155, 214, 0.55); }
        #restartButton:active { transform: scale(0.96); }

        @media (orientation: landscape) and (max-height: 600px) {
            #gameContainer { max-height: 100dvh; }
            .hud .value { font-size: 18px; }
            #instruction { font-size: 11px; }
            #chargeBar { bottom: 48px; width: 180px; height: 13px; }
            #gameOverContent { padding: 22px 28px 20px; }
            #gameOverTitle { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>

        <div id="scoreDisplay" class="hud">
            <span class="dot"></span><span class="label">分数</span><span class="value" id="scoreValue">0</span>
        </div>
        <div id="highScoreDisplay" class="hud">
            <span class="dot"></span><span class="label">最高</span><span class="value" id="highScoreValue">0</span>
        </div>
        <div id="recordHolder" class="holder hidden"></div>

        <button id="musicToggle" type="button" aria-label="关闭背景音乐">♪</button>

        <div id="instruction">长按蓄力，松手弹跳，蓄力达到上限后无法跳更远</div>

        <audio id="bgm" src="assets/bgm-fluffing-duck.mp3" loop preload="metadata"></audio>
        <audio id="sfxBounce" src="assets/sfx-bounce.mp3" preload="auto"></audio>
        <audio id="sfxLand" src="assets/sfx-land.mp3" preload="auto"></audio>

        <div id="credit">BGM: Fluffing a Duck by Kevin MacLeod (CC-BY 4.0, incompetech.com)</div>

        <div id="chargeBar"><div id="chargeBarFill"></div></div>

        <div id="gameOverModal">
            <div id="gameOverContent">
                <div id="newRecordBadge">✦ 新纪录！✦</div>
                <div id="gameOverTitle">游戏结束</div>
                <div id="gameOverMessage"></div>
                <div id="recordPrompt" class="hidden">刷新极限，刻下姓名</div>
                <div id="recordNameRow" class="hidden">
                    <input id="recordNameInput" type="text" maxlength="12" placeholder="输入名字" autocomplete="off">
                </div>
                <div class="scoreRow"><span>本局得分</span><b id="finalScore">0</b></div>
                <div class="scoreRow gold"><span>历史最高</span><b id="finalHigh">0</b></div>
                <button id="restartButton">重新开始</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
